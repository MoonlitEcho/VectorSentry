[project]
name = "vectorsentry"
version = "0.1.0"
description = "Detect, prioritize, and remediate mixed-generation embedding contamination in production vector databases"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sentence-transformers>=3.0",
    "torchvision>=0.29",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.50",
    "starlette>=0.40",  # web dashboard server (phase2_proposed/web_app.py)
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "datasets>=2.19",
    "pulp>=2.8",
]

[project.optional-dependencies]
# Production adapters (vectorsentry package): a real Qdrant vector store.
qdrant = ["qdrant-client>=1.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "pre-commit>=3.7", "qdrant-client>=1.12"]

# --- Packaging layout ------------------------------------------------------
# The repo has three independent top-level folders (common/, phase1_baseline/,
# phase2_proposed/) so that Phase 1 can be git-tagged and demoed in total
# isolation from Phase 2. All three are installed as one editable package
# here purely for import convenience (`import common`, `import phase1`,
# `import phase2` from anywhere) -- the folder separation that matters for
# the two review panels is preserved at the filesystem/git level, not lost
# by sharing one virtualenv.
[tool.setuptools]
package-dir = { "common" = "common/src/common", "phase1" = "phase1_baseline/src/phase1", "phase2" = "phase2_proposed/src/phase2", "vectorsentry" = "production/src/vectorsentry" }
packages = ["common", "phase1", "phase2", "vectorsentry"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["phase1_baseline/tests", "phase2_proposed/tests", "production/tests"]
pythonpath = ["common/src", "phase1_baseline/src", "phase2_proposed/src", "production/src"]
# Slow tests that hit real BEIR data + real embedding models are opt-in
# (`pytest -m integration`), so a routine `pytest` stays fast; CI-style full
# runs use `pytest -m ""` or explicitly include the marker.
markers = ["integration: slower tests using real BEIR data and real embedding models"]
addopts = "-m 'not integration'"

# --- Lint ------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scratch_review1", "vectorsentry.egg-info"]

[tool.ruff.lint]
# pycodestyle, pyflakes, warnings, import order, bugbear, pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long prose lines in docstrings/comments are deliberate (examiner-facing
# explanations); the formatter-free codebase is wrapped by hand at ~120.
# B905: zip() over arrays built to equal length; strict= would add noise.
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["common", "phase1", "phase2", "vectorsentry"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# Gradual typing: checked packages are listed in CI; untyped defs are allowed.
check_untyped_defs = false
